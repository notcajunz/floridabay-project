# -----------------------------------------------------------------------------
# vMenu 3.8.68 (resource vMenu, server-data/resources/[standalone]/vMenu)
#
# Executed by server.cfg before resources start. The live server then starts
# fbrp_core followed by vMenu. Dynamic Discord ACE groups come from fbrp_core;
# player-facing defaults come from config/permissions.cfg.
# -----------------------------------------------------------------------------
setr vmenu_use_permissions true
setr vmenu_menu_staff_only false
setr vmenu_menu_toggle_key "F1"
setr vmenu_noclip_toggle_key "F2"
setr vmenu_keymapping_id "FloridaBayRPF1"

setr vmenu_server_info_message "Welcome to Florida Bay Roleplay. Discord: discord.gg/floridabay"
setr vmenu_server_info_website_url "floridabay.net"
setr vmenu_default_ban_message_information "Use the community support channel to appeal this action."

setr vmenu_log_ban_actions true
setr vmenu_log_kick_actions true
setr vmenu_auto_ban_cheaters false
setr vmenu_keep_spawned_vehicles_persistent false
setr vmenu_vehicle_spawn_delay 5
setr vmenu_delete_vehicle_distance 5.0
setr vmenu_enable_animals_spawn_menu false
setr vmenu_pvp_mode 1

# Weather and time sync belong to gg_weathersystem (see config/resources.cfg), so vMenu's weather,
# dynamic weather and time sync are off. Voice remains owned by pma-voice;
# vMenu's voice permissions are denied in config/permissions.cfg and enforced by
# fbrp_core/client/vmenu_gate.lua.
setr vmenu_disable_voice_chat 1
setr vmenu_enable_weather_sync false
setr vmenu_enable_dynamic_weather false
setr vmenu_dynamic_weather_timer 15
setr vmenu_current_weather "clear"
setr vmenu_weather_change_duration 30
setr vmenu_enable_time_sync false
setr vmenu_freeze_time false
setr vmenu_smooth_time_transitions true
setr vmenu_ingame_minute_duration 2000
setr vmenu_current_hour 12
setr vmenu_current_minute 0
