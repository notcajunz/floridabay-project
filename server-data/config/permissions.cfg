# -----------------------------------------------------------------------------
# Florida Bay Roleplay - static ACE bootstrap
# Dynamic Discord groups are owned by fbrp_core and MariaDB. Staff-only groups
# are attached to the live player principal only between /clockin and /clockout.
# -----------------------------------------------------------------------------

# fbrp_core is the only resource allowed to change live ACE principals. The
# centralized Discord bot writes desired state to MariaDB. It never receives a
# game-console wildcard.
add_ace resource.fbrp_core command.add_ace allow
add_ace resource.fbrp_core command.remove_ace allow
add_ace resource.fbrp_core command.add_principal allow
add_ace resource.fbrp_core command.remove_principal allow
add_ace resource.DiscordAcePerms command.add_principal allow
add_ace resource.DiscordAcePerms command.remove_principal allow

# EasyAdmin needs command execution internally. No permanent player/admin group
# is granted EasyAdmin here. The duty service supplies those groups at runtime.
add_ace resource.EasyAdmin command allow

# Civilian roleplay actions. Restrictive communities can remove this line and
# grant fbrp.civ.restrain only through a Discord-bound ACE group instead.
add_ace builtin.everyone fbrp.civ.restrain allow
add_ace builtin.everyone fbrp.vehicles allow

# Player-facing vMenu features. Everyone may spawn any base-game vehicle from the
# vMenu Vehicle Spawner, one class at a time. vMenu.VehicleSpawner.All is never
# granted: vMenu treats it as the parent of Addon, SpawnByName, BypassRateLimit and
# DisableReplacePrevious, which would open addon and personal/whitelisted models.
# F7 opens the Florida Bay garage, which only lists personal vehicles (and the
# organization garage), never base-game vehicles.
add_ace builtin.everyone "vMenu.VehicleSpawner.Menu" allow
add_ace builtin.everyone "vMenu.VehicleSpawner.Compacts" allow
