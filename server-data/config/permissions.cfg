# -----------------------------------------------------------------------------
# Florida Bay Roleplay - static ACE bootstrap
# Dynamic Discord groups are owned by fbrp_core and MariaDB. Staff-only groups
# are attached to the live player principal only between /clockin and /clockout.
# -----------------------------------------------------------------------------

# fbrp_core is the only resource allowed to change live ACE principals. The
# centralized Discord bot writes desired state to MariaDB. It never receives a
# game-console wildcard.
add_ace resource.fbrp_core command.add_ace allow
add_ace resource.fbrp_core command.remove_ace allow
add_ace resource.fbrp_core command.add_principal allow
add_ace resource.fbrp_core command.remove_principal allow
add_ace resource.DiscordAcePerms command.add_principal allow
add_ace resource.DiscordAcePerms command.remove_principal allow

# EasyAdmin needs command execution internally. No permanent player/admin group
# is granted EasyAdmin here. The duty service supplies those groups at runtime.
add_ace resource.EasyAdmin command allow

# Civilian roleplay actions. Restrictive communities can remove this line and
# grant fbrp.civ.restrain only through a Discord-bound ACE group instead.
add_ace builtin.everyone fbrp.civ.restrain allow
add_ace builtin.everyone fbrp.vehicles allow

# Player-facing vMenu features. The built-in vehicle spawner is intentionally
# disabled. F7 opens the server-validated Florida Bay garage instead.
add_ace builtin.everyone "vMenu.PlayerOptions.Menu" allow
add_ace builtin.everyone "vMenu.PlayerOptions.All" allow
add_ace builtin.everyone "vMenu.VehicleOptions.Menu" allow
add_ace builtin.everyone "vMenu.VehicleOptions.All" allow
add_ace builtin.everyone "vMenu.SavedVehicles.Menu" allow
add_ace builtin.everyone "vMenu.SavedVehicles.All" allow
add_ace builtin.everyone "vMenu.PersonalVehicle.Menu" allow
add_ace builtin.everyone "vMenu.PersonalVehicle.All" allow
add_ace builtin.everyone "vMenu.PlayerAppearance.Menu" allow
add_ace builtin.everyone "vMenu.PlayerAppearance.All" allow
add_ace builtin.everyone "vMenu.WeaponOptions.Menu" allow
add_ace builtin.everyone "vMenu.WeaponOptions.All" allow
add_ace builtin.everyone "vMenu.WeaponLoadouts.Menu" allow
add_ace builtin.everyone "vMenu.WeaponLoadouts.All" allow
add_ace builtin.everyone "vMenu.MiscSettings.ShowCoordinates" allow
add_ace builtin.everyone "vMenu.MiscSettings.ShowLocation" allow
add_ace builtin.everyone "vMenu.MiscSettings.DeathNotifs" allow
add_ace builtin.everyone "vMenu.MiscSettings.RestoreAppearance" allow
add_ace builtin.everyone "vMenu.MiscSettings.RestoreWeapons" allow

# pma-voice owns voice chat. vMenu's own voice chat system is switched off for every
# player and group: vMenu.Everything is never granted as a wildcard (see
# fbrp_core/config_vmenu.lua) and these permissions are denied outright.
add_ace builtin.everyone "vMenu.VoiceChat.Menu" deny
add_ace builtin.everyone "vMenu.VoiceChat.All" deny
add_ace builtin.everyone "vMenu.VoiceChat.Enable" deny
add_ace builtin.everyone "vMenu.VoiceChat.ShowSpeaker" deny
add_ace builtin.everyone "vMenu.VoiceChat.StaffChannel" deny
