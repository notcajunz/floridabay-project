# -----------------------------------------------------------------------------
# Florida Bay Roleplay - resources started after fbrp_core
# Exec'd from server.cfg right after config/phone.cfg (the deploy script keeps that line in place).
# server.cfg itself is untracked, so every resource added after the core set is started from this
# tracked file. Order matters and is kept as it was: PolyZone before golf, FBRP-Sirens before
# fbrp_sirenmenu, jaxtti_lib before jaxtti_core, and the Roxwood clothing stop after the Roxwood map.
# Add new resources in the section they belong to, not at the end.
# -----------------------------------------------------------------------------

# Wraith ARS 2X police radar and plate reader (resource wk_wars2x, MIT). This file is the tracked,
# exec'd place to start it, so no server.cfg edit is needed. The resource name must stay lowercase
# and unchanged. It only works in LEO vehicles (see fbrp_core `IsLeoVehicle`).
ensure wk_wars2x

# Los Santos Golf Club minigame (resource golf, from alberttheprince/FiveM-Golf). It needs PolyZone
# (mkafrin/PolyZone, MIT) for the course and water-hazard zones, so PolyZone must start first.
ensure PolyZone
ensure golf

# Overhead headtag/gangtag rendering and LEO/fire ID cards, ported from the Jaxtti tag system. Tag
# content still comes from fbrp_core's fbrp:headtag / fbrp:gangtag state bags.
ensure fbrp_tags

# Free interior (MLO) maps for organization properties. Sources and licenses are in each folder:
# lev_laundromat (MIT), pp_pipedown (GPL-3.0), fury_gs_01 (GPL-3.0, attribution required),
# soa_clubhouse (MIT, credit Dr.Bob THCRP), iak_pipeline_inn and iak_yatchclub (PolyForm
# Noncommercial 1.0.0, Malibu Tech Team).
ensure lev_laundromat
ensure pp_pipedown
ensure fury_gs_01
ensure soa_clubhouse
ensure iak_pipeline_inn
ensure iak_yatchclub

# More free MLOs: iak_drug_farm and iak_wonkas_fudge_factory (PolyForm Noncommercial 1.0.0, Malibu
# Tech Team), powerst_records (CC BY-NC-SA 4.0, Imperial Studio), mlo_drugshuis (CC0, Yours_Truely).
ensure iak_drug_farm
ensure iak_wonkas_fudge_factory
ensure powerst_records
ensure mlo_drugshuis

# Free house and mansion MLOs released by their authors without a license: great_ocean_mansion,
# fivempost_mansion1, weston_mansion, families_house, grove_street_house, noah_mc_clubhouse.
ensure great_ocean_mansion
ensure fivempost_mansion1
ensure weston_mansion
ensure families_house
ensure grove_street_house
ensure noah_mc_clubhouse

# Dev server transfer (2026-10-24): Roxwood map, Halloween loading screen, death system, jail, fuel and utility scripts.
ensure DeathScript
ensure fbrp_deleteveh
ensure fbrp_fuel
ensure fbrp_jail
ensure fbrp_staffjail
ensure fbrp_airstrike
ensure NativeUI
ensure fbrp_grief
ensure fbrp_mk2guard
ensure fbrp_hudnotice
ensure fbrp_lights
ensure FBRP-Sirens
ensure fbrp_sirenmenu
# Discord priority queue (configure in resources/[standalone]/Quantix-Queue/config.lua)
ensure Quantix-Queue
ensure NoNPC
ensure fbrp_donatormenu
ensure fbrp-enginesoundmenu
ensure jaxtti-carwipe
ensure fbrp-misc
ensure ox_doorlock
ensure qx-online
ensure qx-waterdata
ensure jaxtti_lib
ensure jaxtti_core
ensure jaxtti_collision

# CarPlay in-car system (fbrp_carplay, by Saif, from the dev server). It plays music through xsound, which is the patched
# copy from the dev server (adds the setMuffle export for the muffled-window sound), so xsound must start first.
ensure xsound
ensure fbrp_carplay

# Loads the vanilla train carriage models the Roxwood train script (escrowed) forgets to request.
ensure fbrp_trainmodels

# Roxwood map and the Halloween loading screen, copied straight from the dev server (2026-10-24).
# fbrp_loading is stopped on purpose: the Halloween loading screen replaces it. Remove these lines to go back.
stop fbrp_loading
ensure fbrp-LChalloween
ensure [roxwood]
# dps-transit (DaemonAlex, from github.com/DaemonAlex/dps-transit, no license file upstream) runs the Regional Rail and
# LS Metro trains with free rides through bridge/fbrp.lua. It owns the tracks, so the escrowed Roxwood train script is
# stopped on purpose; remove `stop amb-roxwood-trains` and the dps-transit line to go back.
stop amb-roxwood-trains
ensure dps-transit
# Roxwood's freemode clothing (mp_m_ambm, mp_m_roxws) is stopped on purpose: with the live EUP packs it made
# SetPlayerModel(mp_m_freemode_01) throw a native exception and then crash the game client right after picking a spawn.
stop amb-roxwood-clothing
