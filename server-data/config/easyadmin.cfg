# -----------------------------------------------------------------------------
# EasyAdmin base configuration
# -----------------------------------------------------------------------------
setr ea_LanguageName "en"
setr ea_IpPrivacy "true"
# FiveM EasyAdmin leaves its own mapping unbound. fbrp_core provides the F11
# toggle under a stable server-owned mapping so it also works for existing users.
setr ea_defaultKey "F11"
set ea_logIdentifier "discord,license"
set ea_minIdentifierMatches 2
set ea_presentDeferral "true"

# Black / light-blue ban and connection card branding.
set ea_banMessageTitleColour "#69C9FF"
set ea_banMessageServerName "Florida Bay Roleplay"
set ea_banMessageSubHeader "Access to Florida Bay Roleplay has been restricted."
set ea_banMessageFooter "Appeal information will be available in the community support channel."
set ea_banMessageShowStaff "true"

set ea_enableCallAdminCommand "true"
set ea_enableReportCommand "true"
set ea_callAdminCommandName "calladmin"
set ea_reportCommandName "report"
set ea_callAdminCooldown 60

# Moderation, detailed administration, and report webhooks are all pointed at
# the private staff EasyAdmin log channel from secrets.cfg.

