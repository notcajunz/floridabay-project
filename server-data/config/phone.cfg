# -----------------------------------------------------------------------------
# Florida Bay Roleplay - character phone (sky_phone)
# Exec this file at the end of server.cfg, after `ensure fbrp_core`:
#   exec config/phone.cfg
# Every character selected at spawn gets its own device, number, contacts,
# messages and settings. Open it with the Up arrow or /phone.
# -----------------------------------------------------------------------------

# sky_phone registers its own sky_phone.<permission> ACE objects for the
# fbrp_owner, fbrp_founder and fbrp_admin groups and removes them on stop.
add_ace resource.sky_phone command.add_ace allow
add_ace resource.sky_phone command.remove_ace allow

ensure sky_phone

# Wraith ARS 2X police radar and plate reader (resource wk_wars2x, MIT). This file is the tracked,
# exec'd place to start it, so no server.cfg edit is needed. The resource name must stay lowercase
# and unchanged. It only works in LEO vehicles (see fbrp_core `IsLeoVehicle`).
ensure wk_wars2x

# Los Santos Golf Club minigame (resource golf, from alberttheprince/FiveM-Golf). It needs PolyZone
# (mkafrin/PolyZone, MIT) for the course and water-hazard zones, so PolyZone must start first.
ensure PolyZone
ensure golf

# Overhead headtag/gangtag rendering and LEO/fire ID cards, ported from the Jaxtti tag system. Tag
# content still comes from fbrp_core's fbrp:headtag / fbrp:gangtag state bags.
ensure fbrp_tags

