<main class="ws" id="panel">
<header class="ws-head">
<div>
<h1 data-text="panel_title">Weather</h1>
<p><span id="headLine">Everyone on the server sees this.</span></p>
</div>
<button class="shut" id="close" data-label="key_close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
</header>
<section class="ws-time">
<div class="clock">
<input id="clock" type="text" inputmode="numeric" maxlength="5" spellcheck="false" autocomplete="off" value="12:00">
<span class="clock-line"><b id="phase"></b><span id="phaseState"></span></span>
<button class="row pill" id="freezeTime">
<svg class="icon"><use href="#i-lock"/></svg>
<span data-text="freeze_time">Freeze time</span>
<i class="switch"><i></i></i>
</button>
</div>
<!-- One day in four quarters, each ending at its button's time: 00 and 24 are the same
moment, so midnight is only the 24 at the right end. -->
<div class="day" id="day">
<div class="day-track"></div>
<i class="day-mark" id="dayMark"></i>
<div class="day-ticks"><span>06</span><span>12</span><span>18</span><span>24</span></div>
</div>
<div class="presets" id="presets">
<button data-minute="360"><svg class="icon"><use href="#i-sunrise"/></svg><span data-text="preset_dawn">Dawn</span></button>
<button data-minute="720"><svg class="icon"><use href="#i-sun"/></svg><span data-text="preset_noon">Noon</span></button>
<button data-minute="1080"><svg class="icon"><use href="#i-sunset"/></svg><span data-text="preset_dusk">Dusk</span></button>
<button data-minute="0"><svg class="icon"><use href="#i-moon"/></svg><span data-text="preset_midnight">Midnight</span></button>
</div>
</section>
<section class="ws-weather">
<h2><span data-text="section_weather">Weather</span><b id="weatherName"></b></h2>
<div class="grid" id="grid"></div>
<div class="pair">
<button class="row" id="freezeWeather">
<svg class="icon"><use href="#i-lock"/></svg>
<span data-text="freeze_weather">Freeze weather</span>
<i class="switch"><i></i></i>
</button>
<button class="row" id="blackout">
<svg class="icon"><use href="#i-lightbulb-off"/></svg>
<span data-text="blackout">Blackout</span>
<i class="switch"><i></i></i>
</button>
</div>
</section>
<section class="ws-events" id="eventsSection" hidden>
<h2><span data-text="section_events">Events</span><b id="eventName"></b></h2>
<div class="grid events" id="events"></div>
</section>
<section class="ws-sky">
<h2><span data-text="section_sky">Sky</span><b id="lookName"></b></h2>
<div class="looks" id="looks"></div>
</section>
<!-- What the keys do. Shift lights while it is held, an arrow as it is pressed. -->
<footer class="ws-keys" id="keys">
<button class="key" id="keyClose"><kbd>Esc</kbd><span data-text="key_close">Close</span></button>
<span class="key shift"><kbd>Shift</kbd><span data-text="key_instant">Hold for instant</span></span>
<span class="key" data-keys="ArrowLeft ArrowRight"><kbd><svg class="icon"><use href="#i-arrow-left"/></svg></kbd><kbd><svg class="icon"><use href="#i-arrow-right"/></svg></kbd><span data-text="key_hour">Hour</span></span>
<span class="key" data-keys="ArrowUp ArrowDown"><kbd><svg class="icon"><use href="#i-arrow-up"/></svg></kbd><kbd><svg class="icon"><use href="#i-arrow-down"/></svg></kbd><span data-text="key_weather">Weather</span></span>
</footer>
</main>
<!-- The Earthquake tile's flyout: where it strikes, how big, and a way to stop it. -->
<aside class="quake" id="quake">
<header class="quake-head">
<svg class="icon big"><use href="#i-activity"/></svg>
<div>
<h2 data-text="quake_title">Earthquake</h2>
<p id="quakeLine"></p>
</div>
</header>
<small class="cap" data-text="quake_cap_where">Where</small>
<div class="chips" id="quakePlaces"></div>
<small class="cap" data-text="quake_cap_size">How big</small>
<div class="sizes" id="quakeSizes">
<button data-magnitude="4.5"><b>4.5</b><span data-text="mag_light">Light</span></button>
<button data-magnitude="5.5"><b>5.5</b><span data-text="mag_moderate">Moderate</span></button>
<button data-magnitude="6.5"><b>6.5</b><span data-text="mag_strong">Strong</span></button>
<button data-magnitude="7.5"><b>7.5</b><span data-text="mag_major">Major</span></button>
</div>
<button class="row" id="quakeStop" hidden>
<svg class="icon"><use href="#i-circle-stop"/></svg>
<span data-text="quake_stop">Stop the shaking</span>
</button>
</aside>
<!-- /weatherstatus and /weatherforecast. -->
<aside class="report" id="report">
<header class="report-head">
<svg class="icon big"><use id="reportIcon" href="#i-sun"/></svg>
<div>
<small id="reportKind"></small>
<h2 id="reportWeather"></h2>
<p id="reportClock"></p>
</div>
</header>
<ul class="report-lines" id="reportLines"></ul>
<small class="report-cap" id="reportCap" data-text="report_next">Coming up</small>
<ol class="report-next" id="reportNext"></ol>
</aside>
<div class="notice" id="notice"><svg class="icon"><use href="#i-cloud-sun"/></svg><span id="noticeText"></span></div>
<script src="app.js"></script>
</body>
</html>
