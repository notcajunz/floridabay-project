<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather System &mdash; GG Studio</title>
<meta http-equiv="refresh" content="0; url=https://www.ggstudio.store/docs/weathersystem/installation">
<style>
    :root { color-scheme: dark; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0b;
        color: #f5f5f5;
        font: 500 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
    }

    main { padding: 40px 28px; max-width: 520px; }

    .mark {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .24em;
        text-transform: uppercase;
        color: #9b4dff;
    }

    h1 { margin: 10px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }

    p { margin: 14px 0 0; color: rgba(245, 245, 245, .55); font-size: 15px; }

    a.go {
        display: inline-block;
        margin-top: 26px;
        padding: 13px 26px;
        border-radius: 8px;
        background: #7900ff;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
    }

    a.go:hover { filter: brightness(1.12); }

    a.discord { display: inline-block; margin-top: 20px; color: rgba(245, 245, 245, .4); font-size: 14px; }
</style>
</head>
<body>
<main>
    <p class="mark">GG Studio</p>
    <h1>Weather System</h1>
    <p>Taking you to the documentation&hellip;</p>

    <a class="go" href="https://www.ggstudio.store/docs/weathersystem/installation">Open the docs</a>

    <p><a class="discord" href="https://discord.gg/GMbRek7SFa">Need a hand? Join the Discord</a></p>
</main>
</body>
</html>
