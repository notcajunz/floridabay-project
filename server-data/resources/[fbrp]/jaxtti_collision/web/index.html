<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jaxtti_collision</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
  #vignette {
    position: fixed; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(120, 0, 8, 0.55) 80%, rgba(40, 0, 0, 0.85) 100%);
    transition: opacity 0.35s ease;
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; }
  #flash.hit { animation: hit 0.45s ease-out; }
  @keyframes hit { 0% { opacity: 0.55; } 100% { opacity: 0; } }
  #vignette.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { filter: brightness(1); } 15% { filter: brightness(1.35); } 30% { filter: brightness(1.05); } 45% { filter: brightness(1.25); } }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="flash"></div>
<script>
(() => {
  const vignette = document.getElementById('vignette');
  const flash = document.getElementById('flash');
  const sounds = {};
  let vignetteTimer = null;

  function sound(name, { loop = false, volume = 0.45, fadeOut = 0 } = {}) {
    let a = sounds[name];
    if (!a) { a = new Audio(`sfx/${name}.mp3`); sounds[name] = a; }
    clearInterval(a._fade);
    a.loop = loop;
    a.volume = Math.max(0, Math.min(1, volume));
    a.currentTime = 0;
    a.play().catch(() => {});
    if (fadeOut > 0) {
      const start = Date.now();
      const v0 = a.volume;
      a._fade = setInterval(() => {
        const k = 1 - (Date.now() - start) / fadeOut;
        if (k <= 0) { clearInterval(a._fade); a.pause(); return; }
        a.volume = v0 * k;
      }, 100);
    }
  }

  function stop(name) {
    const a = sounds[name];
    if (!a) return;
    clearInterval(a._fade);
    a.pause();
  }

  window.addEventListener('message', ({ data }) => {
    if (!data || !data.action) return;
    const d = data.data || {};
    switch (data.action) {
      case 'impact':
        flash.classList.remove('hit');
        void flash.offsetWidth;
        flash.style.background = d.strength > 0.6 ? '#ffffff' : '#ffe9e9';
        flash.classList.add('hit');
        break;
      case 'vignette':
        clearTimeout(vignetteTimer);
        vignette.style.opacity = Math.max(0, Math.min(1, d.strength || 0));
        vignette.classList.toggle('pulse', !!d.pulse);
        if (d.ms) vignetteTimer = setTimeout(() => { vignette.style.opacity = 0; vignette.classList.remove('pulse'); }, d.ms);
        break;
      case 'sound':
        sound(d.name, d);
        break;
      case 'stop':
        stop(d.name);
        break;
      case 'clear':
        clearTimeout(vignetteTimer);
        vignette.style.opacity = 0;
        vignette.classList.remove('pulse');
        Object.keys(sounds).forEach(stop);
        break;
    }
  });
})();
</script>
</body>
</html>
