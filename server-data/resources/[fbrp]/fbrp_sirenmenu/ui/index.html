<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#141517; --bg2:#1b1c1f; --line:#2c2e33; --accent:#e9e9ec; --text:#f2f2f4; --dim:#8b8d94; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif; color:var(--text); user-select:none; }

  /* vertically centred on the right side of the screen */
  #wrap { position:fixed; top:50%; right:2vw; transform:translateY(-50%);
    width:min(24vw, 360px); min-width:290px;
    display:none; flex-direction:column; align-items:stretch; gap:12px; }
  #wrap.show { display:flex; }

  #logo { width:100%; filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  #panel { background:linear-gradient(180deg,var(--bg2),var(--bg)); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 10px 34px rgba(0,0,0,.65); overflow:hidden; }
  #title { padding:11px 16px; font-weight:600; letter-spacing:1.5px; color:var(--dim);
    border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; text-align:center; }

  #picker { display:flex; align-items:center; gap:10px; padding:18px 12px 6px; }
  .arrow { width:40px; height:46px; border-radius:9px; border:1px solid var(--line); background:#202125;
    color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s; }
  .arrow:hover { background:#2b2c31; border-color:#4a4c53; }
  .arrow:active { background:#34353b; }
  #current { flex:1; text-align:center; font-size:20px; font-weight:600; padding:6px 4px; min-height:46px;
    display:flex; flex-direction:column; justify-content:center; letter-spacing:.3px; }
  #badge { font-size:10px; color:#7fd99a; letter-spacing:1.5px; height:12px; margin-top:3px; font-weight:600; }
  #count { text-align:center; font-size:12px; color:var(--dim); padding-bottom:14px; letter-spacing:1px; }
  #apply { margin:0 16px 14px; padding:11px; text-align:center; border-radius:9px; background:var(--accent);
    color:#141517; font-weight:700; letter-spacing:1.5px; cursor:pointer; font-size:12px; transition:background .15s; }
  #apply:hover { background:#ffffff; }
  #apply:active { background:#cfcfd4; }
  #hint { padding:9px 14px; font-size:11px; color:var(--dim); border-top:1px solid var(--line); text-align:center; letter-spacing:.3px; }

  #toasts { position:fixed; right:2vw; bottom:4vh; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .toast { background:var(--bg); border:1px solid var(--line); border-left:4px solid #6b6d75;
    padding:11px 15px; border-radius:10px; max-width:340px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.6); color:var(--text); }
  .toast.error { border-left-color:#ff5560; } .toast.success { border-left-color:#3ddc84; }
  .toast b { display:block; color:var(--dim); font-size:10px; letter-spacing:1.5px; margin-bottom:3px; font-weight:600; }
</style>
</head>
<body>
  <div id="wrap">
    <img id="logo" src="logo.png">
    <div id="panel">
      <div id="title"></div>
      <div id="picker">
        <div class="arrow" id="prev">◀</div>
        <div id="current"><span id="name"></span><span id="badge"></span></div>
        <div class="arrow" id="next">▶</div>
      </div>
      <div id="count"></div>
      <div id="apply">ENTER TO APPLY</div>
      <div id="hint"></div>
    </div>
  </div>
  <div id="toasts"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const res = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'fbrp_sirenmenu';
    const post = (name, data) => fetch(`https://${res}/${name}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data || {})
    }).catch(() => {});

    let items = [], sel = 0, active = 0, open = false;

    function render() {
      $('name').textContent = items[sel] || '';
      $('badge').textContent = sel === active ? 'ACTIVE' : '';
      $('count').textContent = items.length ? `${sel + 1} / ${items.length}` : '';
    }
    function move(d) { if (!items.length) return; sel = (sel + d + items.length) % items.length; render(); }
    function apply() { active = sel; render(); post('select', { index: sel + 1 }); }

    $('prev').onclick = () => move(-1);
    $('next').onclick = () => move(1);
    $('apply').onclick = apply;

    function toast(msg, kind) {
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || '');
      t.innerHTML = '<b>FLORIDA BAY RP</b>';
      t.appendChild(document.createTextNode(msg));
      $('toasts').appendChild(t);
      setTimeout(() => t.remove(), 6500);
    }

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (d.action === 'open') {
        items = d.sirens; sel = active = (d.index || 1) - 1; open = true;
        $('title').textContent = d.title;
        if (d.hint) $('hint').textContent = d.hint;
        $('logo').style.display = d.showLogo ? 'block' : 'none';
        $('wrap').classList.add('show'); render();
      } else if (d.action === 'key') {
        if (!open) return;
        if (d.key === 'next') move(1);
        else if (d.key === 'prev') move(-1);
        else if (d.key === 'apply') apply();
      } else if (d.action === 'close') {
        open = false; $('wrap').classList.remove('show');
      } else if (d.action === 'notify') {
        toast(d.message, d.kind);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!open) return;
      if (e.key === 'Escape' || e.key === 'Backspace') post('close');
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') move(1);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') move(-1);
      else if (e.key === 'Enter') apply();
    });
  </script>
</body>
</html>
