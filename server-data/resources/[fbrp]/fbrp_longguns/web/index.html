<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trunk Weapons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="panel" class="panel" hidden>
    <header>
      <div>
        <strong>Trunk weapons</strong>
        <span id="plate" class="plate"></span>
      </div>
      <button id="close" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="columns">
      <section>
        <h2>On you <small id="carriedCount"></small></h2>
        <div id="carried" class="list"></div>
      </section>
      <section>
        <h2>In trunk <small id="trunkCount"></small></h2>
        <div id="trunk" class="list"></div>
      </section>
    </div>
    <footer>Long guns only come out of a trunk. Press <kbd>J</kbd> to sling or draw. Pistols never need one.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
