<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// FBRP Iron Man - sound player. The Lua client sends {play, volume, loop} / {stop} / {stopAll}.
const playing = {};
function stopOne(name) {
  const a = playing[name];
  if (a) { a.pause(); delete playing[name]; }
}
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.stopAll) { Object.keys(playing).forEach(stopOne); return; }
  if (d.stop) { stopOne(d.stop); return; }
  if (!d.play || !/^[a-z_]+$/.test(d.play)) return;
  if (d.loop && playing[d.play]) return;
  const a = new Audio('sfx/' + d.play + '.wav');
  a.volume = Math.min(1, Math.max(0, d.volume == null ? 0.5 : d.volume));
  a.loop = !!d.loop;
  if (d.loop) playing[d.play] = a;
  a.play().catch(() => {});
});
</script>
</body></html>
