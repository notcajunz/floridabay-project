<!doctype html>
<html><head><meta charset="utf-8"><title>FBRP YouTube relay</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'unsafe-inline'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src https://www.youtube.com https://*.googlevideo.com; img-src https: data:; media-src https: blob:">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head><body><div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player, ready = false, parentOrigin = null;
function post(o){ if (!parentOrigin) return; o.fbrpRelay = 1; parent.postMessage(o, parentOrigin); }
function onYouTubeIframeAPIReady(){
  player = new YT.Player("p", {
    width: "100%", height: "100%",
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1 },
    events: {
      onReady: function(){ ready = true; post({ type: "ready" }); },
      onStateChange: function(e){ post({ type: "state", data: e.data }); },
      onError: function(e){ post({ type: "error", data: e.data }); },
      onAutoplayBlocked: function(){ post({ type: "autoplayBlocked" }); }
    }
  });
}
setInterval(function(){
  if (!ready) return;
  try { post({ type: "time", t: player.getCurrentTime(), d: player.getDuration() }); } catch (e) {}
}, 500);
addEventListener("message", function(e){
  var m = e.data;
  if (e.source !== parent || !m || !m.fbrp) return;
  if (!parentOrigin) parentOrigin = e.origin;
  if (e.origin !== parentOrigin) return;
  if (m.cmd === "hello") { if (ready) post({ type: "ready" }); return; }
  if (!ready || typeof m.cmd !== "string" || !Array.isArray(m.args)) return;
  var a = m.args || [];
  try {
    switch (m.cmd) {
      case "load": if (/^[A-Za-z0-9_-]{11}$/.test(String(a[0] || ""))) player.loadVideoById(a[0]); break;
      case "play": player.playVideo(); break;
      case "pause": player.pauseVideo(); break;
      case "stop": player.stopVideo(); break;
      case "seek": if (Number.isFinite(Number(a[0]))) player.seekTo(Math.max(0, Number(a[0])), true); break;
      case "vol": if (Number.isFinite(Number(a[0]))) player.setVolume(Math.max(0, Math.min(100, Number(a[0])))); break;
      case "mute": player.mute(); break;
      case "unmute": player.unMute(); break;
    }
  } catch (x) {}
});
</script></body></html>
