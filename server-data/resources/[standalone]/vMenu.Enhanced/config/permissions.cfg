###############################################################################
#  Florida Bay Roleplay: vMenu Enhanced permissions.
#
#  Nothing is granted here. Every vMenu permission comes from:
#    * server-data/config/permissions.cfg  (what every player may use)
#    * fbrp_core, from the ACE groups the Discord bot and the website manage. Old
#      vMenu permission names stored there (vMenu.PlayerOptions.God, ...) are
#      translated to their vMenu Enhanced names (fbrp_core/config_vmenu.lua), so
#      every existing role binding keeps working. vMenu.Enhanced.* names can be
#      granted directly too.
#  NoClip (vMenu.Enhanced.NoClip) is only ever granted to staff while they are
#  clocked in. Never grant vMenu.Enhanced.Everything, Menus.All or
#  Menus.WeaponOptions.All to a broad group: they also unlock the role-locked
#  custom weapons (config/model-whitelists.json).
###############################################################################

# vMenu needs these two lines so an integration's role sync can add and remove
# permission groups for players. fbrp_core manages principals itself.
add_ace resource.vMenu.Enhanced command.add_principal allow
add_ace resource.vMenu.Enhanced command.remove_principal allow
