<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <title>S4 Chat</title>
  <script type="module" crossorigin src="./assets/index-Dx-ZKZgG.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DPHNLQ7u.css">
  <style>
    /* Florida Bay readability defaults. Player /editchat choices still apply. */
    :root { --width: 36vw; --width-min: 460px; --width-max: 720px; --bg: #040404b8; --bg-strong: #040404c7; }
    .chat { zoom: 1 !important; }
    .messages { gap: 8px; max-height: 50vh; margin-bottom: 12px; }
    .messages:not(:empty) { padding: 14px 16px; }
    .msg.rich { gap: 5px; padding: 4px 5px; }
    .m-head { gap: 10px; }
    .m-badge { font-size: 12.5px; }
    .m-ic { font-size: 17px; }
    .m-name { font-size: 14px; }
    .m-id, .m-time { font-size: 12px; }
    .m-text { font-size: 16px; line-height: 1.55; }
    .msg:not(.rich) { font-size: 15.5px; line-height: 1.55; }
    .input-bar { gap: 12px; padding: 13px 14px; }
    .mode-chip { font-size: 12.5px; padding: 6px 11px; }
    #input { font-size: 16px; line-height: 1.5; }
    .counter { font-size: 12px; }
    .suggestion { padding: 10px 12px; }
    .cmd { font-size: 14.5px; }
    .help { font-size: 13px; }
  </style>
</head>

<body>
  <div id="root"></div>
</body>

</html>
