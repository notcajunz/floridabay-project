<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Florida Bay Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="chat" class="chat-shell" aria-label="Florida Bay chat">
    <header class="chat-header">
      <div class="brand"><span class="brand-mark">FB</span><span class="brand-name">Florida Bay</span></div>
      <nav id="filters" class="filters" aria-label="Channel filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="ooc">OOC</button>
        <button type="button" data-filter="do">Do</button>
        <button type="button" data-filter="gme">GME</button>
        <button type="button" data-filter="social">Social</button>
        <button type="button" data-filter="system">System</button>
      </nav>
      <span class="range"><i></i>20m</span>
    </header>
    <section id="messages" class="transcript" aria-live="polite"></section>
    <section id="suggestions" class="suggestions" aria-label="Command suggestions"></section>
    <form id="composer" class="composer" autocomplete="off">
      <span id="mode" class="mode" data-mode="say">SAY</span>
      <input id="input" maxlength="300" placeholder="Say something nearby, or type / for commands" aria-label="Chat message">
      <span id="counter" class="counter"></span>
      <button type="submit" aria-label="Send">&#10148;</button>
    </form>
    <footer class="chat-footer"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> history</span><span><kbd>Tab</kbd> complete</span><span><kbd>Esc</kbd> close</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
