<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Florida Bay chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="chat" class="faded">
  <div id="chatFx" class="chat-fx" aria-hidden="true"></div>
  <div id="messages"></div>
  <div id="inputWrap" class="hidden">
    <div id="suggest"></div>
    <div class="input">
      <span class="deco season-ic" aria-hidden="true"></span>
      <span class="slash">›</span>
      <span class="lead season-ic" aria-hidden="true"></span>
      <input id="input" maxlength="300" autocomplete="off" spellcheck="false" placeholder="Say something or type / for commands">
      <span class="hint">ENTER</span>
      <span class="send" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
    </div>
  </div>
</div>
<script src="seasons.js"></script>
<script src="app.js"></script>
</body>
</html>
