# FBRP DDoS tuning: bigger queues so floods don't push out real packets, faster cleanup of half-open/dead flows.
# Lives next to 99-vps-hardening.conf (which already sets syncookies, rfc1337, redirects, martians).

# Packet backlog per CPU before the kernel starts dropping (default 1000 is easily overrun).
net.core.netdev_max_backlog = 16384
net.core.netdev_budget = 600

# Socket buffers, so FXServer's UDP socket can absorb bursts.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_rmem_min = 16384

# SYN flood resilience.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_abort_on_overflow = 0
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_orphans = 65536

# Connection tracking: room for floods, and junk entries expire fast.
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 20
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.netfilter.nf_conntrack_udp_timeout = 10
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_icmp_timeout = 10
net.netfilter.nf_conntrack_tcp_loose = 0

# ICMP: answer less, never to broadcasts.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_ratelimit = 100

# Spread packet processing over all 4 vCPUs (ens3 has a single RX queue); RPS itself is set by the shield service.
net.core.rps_sock_flow_entries = 32768
