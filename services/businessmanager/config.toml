# Support tickets. Every type opens a private channel in its Discord category. Staff of a type
# are its staff_role_ids plus admin_role_ids; ping_role_ids are mentioned when a ticket opens.
# transcript_channel_id also receives that type's open/close log unless log_channel_id is set.
