[access]
# When true, these two groups bypass command allowlists/denylists.
administrators_bypass = true
owners_bypass = true

# Modes:
#   inherit   = use the command's built-in manager/gang/role-manager checks
#   allowlist = only the listed users/roles (plus configured bypasses)
#   denylist  = everyone except the listed users/roles
#
# Permission categories below list every registered command exactly once.
# Category rules are functional: changing a category to allowlist or denylist
# applies that rule to every command in its commands array.
#
# Exact command rules override category rules. Add one when a command needs an
# exception, for example:
# [access.commands."bank give"]
# mode = "allowlist"
# users = [123456789012345678]
# roles = [234567890123456789]

[access.categories.administration]
mode = "inherit"
users = []
roles = [1559682494364647524]
commands = [
  "admin avatar",
  "admin gang rolecheck",
  "admin info",
  "admin nick",
  "admin refreshgangtiers",
  "admin reloadcog",
  "admin username",
]

