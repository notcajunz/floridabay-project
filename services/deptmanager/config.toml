[access]
# When true, these two groups bypass command allowlists/denylists.
administrators_bypass = true
owners_bypass = true

# Modes:
#   inherit   = use the command's built-in rank checks (see [bot.level_ranks])
#   allowlist = only the listed users/roles (plus configured bypasses)
#   denylist  = everyone except the listed users/roles
# Exact command rules override category rules, for example:
# [access.commands."transfer member"]
# mode = "allowlist"
# roles = [1560393436081692805]

[access.categories.departments]
mode = "inherit"
users = []
roles = []
commands = ["dept add", "dept create", "dept hours", "dept info", "dept list", "dept remove", "dept role", "dept status", "dept update"]

[access.categories.email]
mode = "inherit"
users = []
roles = []
commands = ["email adduser", "email list", "email registrar", "email removeuser", "email wipe"]

[access.categories.coordination]
mode = "inherit"
users = []
roles = []
commands = ["coord activity", "coord add", "coord job", "coord remove", "coord update"]

[access.categories.members]
mode = "inherit"
users = []
roles = []
commands = [
  "member deletepunishment", "member editpunishment", "member history", "member logpunishment",
  "role add", "role remove", "rolewipe",
  "cooldown apply", "cooldown clear", "cooldown view",
  "transfer blacklist", "transfer member",
  "temprole delete", "temprole extend", "temprole list",
]

[access.categories.administration]
mode = "inherit"
users = []
roles = []
commands = [
  "admin avatar", "admin info", "admin nick", "admin rolecheck", "admin username",
  "dm send", "embed edit", "embed get", "embed post",
  "permissions set", "permissions view", "role protection", "useradd", "userdel",
]

[access.categories.public_help]
mode = "inherit"
users = []
roles = []
commands = ["help"]

[access.categories.tickets]
# Ticket staff checks run inside the commands; the roles come from [tickets] below.
mode = "inherit"
users = []
roles = []
commands = [
  "ticket add", "ticket claim", "ticket close", "ticket list",
  "ticket panel", "ticket remove", "ticket rename", "ticket transcript",
]

