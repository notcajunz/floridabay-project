[access]
# When true, these two groups bypass command allowlists/denylists.
administrators_bypass = true
owners_bypass = true

# Modes:
#   inherit   = use the command's built-in rank checks (see [bot.level_ranks])
#   allowlist = only the listed users/roles (plus configured bypasses)
#   denylist  = everyone except the listed users/roles
# Exact command rules override category rules, for example:
# [access.commands."transfer member"]
# mode = "allowlist"
# roles = [1570223506166120489]

[access.categories.departments]
mode = "inherit"
users = []
roles = []
commands = ["dept add", "dept create", "dept hours", "dept info", "dept join", "dept leave", "dept list", "dept remove", "dept role", "dept status", "dept update"]

[access.categories.email]
mode = "inherit"
users = []
roles = []
commands = ["email adduser", "email list", "email registrar", "email removeuser", "email wipe"]

[access.categories.coordination]
mode = "inherit"
users = []
roles = []
commands = ["coord activity", "coord add", "coord job", "coord remove", "coord sync", "coord update", "position remove", "position set"]

[access.categories.members]
mode = "inherit"
users = []
roles = []
commands = [
  "member deletepunishment", "member editpunishment", "member history", "member logpunishment",
  "role add", "role remove", "rolewipe",
  "cooldown apply", "cooldown clear", "cooldown view",
  "transfer blacklist", "transfer member",
  "temprole delete", "temprole extend", "temprole list",
]

[access.categories.administration]
